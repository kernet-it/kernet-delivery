# Every rule at the gate, the way ruff.toml selects ALL: ty ships no ALL
# switch, so the rules it keeps below error are promoted one by one, and
# error-on-warning turns whatever a future release adds at warn into a
# failure — the pin moves by hand, and a new rule gets a decision here
# instead of silence.
[terminal]
error-on-warning = true

[rules]
# Shipped at warn, promoted.
ambiguous-protocol-member = "error"
deprecated = "error"
ignore-comment-unknown-rule = "error"
inconsistent-mro = "error"
ineffective-final = "error"
invalid-enum-member-annotation = "error"
invalid-ignore-comment = "error"
invalid-legacy-positional-parameter = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-bool-conversion = "error"
unused-awaitable = "error"
unused-type-ignore-comment = "error"
# Shipped off, enabled.
blanket-ignore-comment = "error"
division-by-zero = "error"
raw-string-type-annotation = "error"
redundant-cast = "error"
redundant-final-classvar = "error"
shadowed-type-variable = "error"
undefined-reveal = "error"
# Honest because optional imports live in [analysis], never inline: an inline
# ignore for an optional library would flip between used and unused with the
# environment that runs the check.
unused-ignore-comment = "error"

# Addons live at the repo root (one directory per module).
[environment]
python-version = "3.12"
root = ["."]

# The one home for imports the checking environment cannot resolve: Odoo's
# run-time addon namespace, and any optional library an addon imports at run
# time. Extend this list rather than writing an inline
# `# ty: ignore[unresolved-import]`, which unused-ignore-comment would flag
# the moment an environment installs the library.
[analysis]
allowed-unresolved-imports = [
  "odoo.addons.**",
]

[src]
exclude = [
  "**/__pycache__/**",
  ".github/actions/addon-release/check_addon_releases.py",
  ".venv/**",
  "node_modules/**",
]

# Odoo's ORM is dynamic: an addon reads fields the registry merges from other
# classes at run time, so attribute resolution is relaxed for addon code —
# and only there; Python beside the addons keeps every rule. Writes to such
# fields come back as `invalid-assignment` for the same reason.
[[overrides]]
include = ["*/**/*.py"]

[overrides.rules]
unresolved-attribute = "ignore"
possibly-missing-attribute = "ignore"
invalid-assignment = "ignore"
# Odoo annotates narrower than it accepts, and addon code sits on the difference:
# `create` is declared `list[ValuesType]` though @api.model_create_multi takes a
# dict, `browse` rejects the None it normalises to an empty recordset, and
# `_table` is `str | None` on the base class though every concrete model has one.
invalid-argument-type = "ignore"

# The template writes nothing below this line. Extra [[overrides]] blocks a
# repo appends here survive every copier update; prefer answers above even so.
